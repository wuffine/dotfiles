# monitors
# -----------------
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:75

# autostart
# -----------------
exec-once=/usr/lib/xdg-desktop-portal & /usr/lib/xdg-desktop-portal-wlr
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=waybar
exec-once=mon-vol
exec-once=swaybg -i ~/.local/share/backgrounds/fog_forest_1.png -m fill
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0

# env variables
# -----------------
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=GBM_BACKEND,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=LIBVA_DRIVER_NAME,nvidia

# miscellaneous
# -----------------
cursor_size=24
allow_tearing=1
xwayland_ignore_scale=1

# appearance
# -----------------
blur=0
shadows=0
border_radius=0
animations=0
gappih=8
gappiv=8
gappoh=12
gappov=12
borderpx=3
rootcolor=0x141b1eff
bordercolor=0x232a2dff
dropcolor=0x6cbfbf55
splitcolor=0xe57474ff
focuscolor=0xb3b9b8ff
maximizescreencolor=0x8ccf7eff
urgentcolor=0xe57474ff
globalcolor=0xe57474ff
overlaycolor=0x6cbfbfff

# rules
# -----------------

# tags
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# layers
layerrule=noblur:1,layer_name:polkit-dialog
layerrule=noblur:1,layer_name:selection

# windows
windowrule=force_tearing:1,appid:.*.
windowrule=isfloating:1,width:1600,height:900,appid:Spotify
windowrule=isfloating:1,width:1600,height:900,appid:mpv
windowrule=isfloating:1,width:1600,height:900,appid:com.gabm.satty
windowrule=isfloating:1,width:1600,height:900,appid:pcmanfm
windowrule=isfloating:1,width:900,height:600,title:yazi
windowrule=isfloating:1,width:900,height:600,title:wiremix
windowrule=isfloating:1,width:900,height:600,title:impala
windowrule=isfloating:1,width:900,height:600,title:nmtui

# device conf
# -----------------

# mouse
mouse_accel_profile=1

# keyboard
repeat_rate=50
repeat_delay=300
numlockon=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle

# keybinds
# -----------------

# session
bind=SUPER,m,quit
bind=SUPER,r,reload_config

# run
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,return,spawn,foot
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp -b '#141b1e55' -c '#8ccf7eff')" -t ppm - | satty -f -
bind=SUPER,b,spawn_shell,pkill waybar && waybar
bind=SUPER,period,spawn,$HOME/.local/bin/logout-menu
bind=CTRL+SHIFT,escape,spawn,foot -T btop btop
bind=SUPER,v,spawn,foot -T wiremix wiremix -v output -m 100
bind=SUPER,w,spawn,librewolf
bind=SUPER,e,spawn,pcmanfm

# window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# move/resize windows
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# window status
bind=SUPER,q,killclient,
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,o,toggleoverlay,
bind=SUPER,u,togglemaximizescreen,
bind=SUPER,comma,minimized,
bind=SUPER+SHIFT,comma,restore_minimized

# layouts
bind=SUPER,n,switch_layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# multimedia
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=SUPER,equal,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
bind=SUPER,minus,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=SUPER,0,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SUPER,bracketLeft,spawn,wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bind=SUPER,bracketRight,spawn,wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+
bind=SUPER,backSlash,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
